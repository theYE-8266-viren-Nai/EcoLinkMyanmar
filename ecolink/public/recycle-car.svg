<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="100%" height="100%">
  <!-- Definition for repeating ridges on the back Hopper -->
  <defs>
    <pattern id="ridge-pattern" width="6" height="120" patternUnits="userSpaceOnUse">
      <line x1="1" y1="15" x2="1" y2="105" stroke="#388E3C" stroke-width="2" />
    </pattern>
  </defs>

  <!-- 1. Cab Front Grille/Windshield lines (Right side) -->
  <path d="M 420 22 L 424 25 L 424 95 L 420 98 Z" fill="#555555" />

  <!-- 2. Side Mirrors (Cab) -->
  <rect x="408" y="8" width="2" height="12" fill="#333333" />
  <circle cx="409" cy="8" r="2" fill="#333333" />
  <rect x="408" y="100" width="2" height="12" fill="#333333" />
  <circle cx="409" cy="112" r="2" fill="#333333" />

  <!-- 3. Main Cabin/Driver Seat (Right Box) -->
  <rect x="348" y="20" width="74" height="80" rx="6" fill="#4CAF50" />
  
  <!-- Cabin Roof Ridges -->
  <g stroke="#388E3C" stroke-width="2" stroke-linecap="round">
    <line x1="360" y1="28" x2="360" y2="92" />
    <line x1="366" y1="28" x2="366" y2="92" />
    <line x1="372" y1="28" x2="372" y2="92" />
    <line x1="378" y1="28" x2="378" y2="92" />
    <line x1="384" y1="28" x2="384" y2="92" />
    <line x1="390" y1="28" x2="390" y2="92" />
    <line x1="396" y1="28" x2="396" y2="92" />
    <line x1="402" y1="28" x2="402" y2="92" />
    <line x1="408" y1="28" x2="408" y2="92" />
  </g>

  <!-- 4. Dark Grey Chassis Connection Bridge -->
  <rect x="326" y="24" width="24" height="72" fill="#37474F" />

  <!-- 5. Large Main Waste Container (Middle Box) -->
  <rect x="94" y="15" width="234" height="90" rx="4" fill="#4CAF50" />
  
  <!-- Inset panels on Main Container -->
  <rect x="102" y="22" width="32" height="76" rx="4" fill="#388E3C" opacity="0.8" />
  <rect x="140" y="22" width="86" height="35" rx="4" fill="#388E3C" opacity="0.8" />
  <rect x="140" y="63" width="86" height="35" rx="4" fill="#388E3C" opacity="0.8" />
  <rect x="232" y="22" width="88" height="35" rx="4" fill="#388E3C" opacity="0.8" />
  <rect x="232" y="63" width="88" height="35" rx="4" fill="#388E3C" opacity="0.8" />

  <!-- Small connection pins/hinges on sides -->
  <rect x="112" y="11" width="6" height="4" fill="#B0BEC5" />
  <rect x="112" y="105" width="6" height="4" fill="#B0BEC5" />

  <!-- 6. Rear Hopper Mechanism (Left Box) -->
  <rect x="20" y="15" width="76" height="90" fill="#4CAF50" />
  
  <!-- Ridged pattern area for the rear loader texture -->
  <rect x="52" y="15" width="40" height="90" fill="url(#ridge-pattern)" />
  
  <!-- Rearmost step/grab handle assembly -->
  <path d="M 26 22 L 50 22 L 50 28 L 26 28 Z" fill="#263238" />
  <path d="M 26 92 L 50 92 L 50 98 L 26 98 Z" fill="#263238" />
  <rect x="22" y="24" width="4" height="72" fill="#263238" />

  <!-- External Hydraulic Pistons / Side Arms -->
  <rect x="42" y="9" width="36" height="4" rx="1" fill="#212121" />
  <rect x="38" y="11" width="12" height="2" fill="#78909C" />
  
  <rect x="42" y="107" width="36" height="4" rx="1" fill="#212121" />
  <rect x="38" y="107" width="12" height="2" fill="#78909C" />
</svg>
